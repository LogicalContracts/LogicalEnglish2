# fly.toml app configuration file generated for logicalenglish2 on 2026-05-11T09:41:09+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

# This is was need on a Mac:
# export DOCKER_HOST=unix:///Users/mc/.docker/run/docker.sock
# then: 
# run ./buildPush.sh (or its build part... as we need to build locally)
# fly secrets set --stage GROQ_API_KEY=yourKey OPENAI_API_KEY=xxx ...
# fly deploy --local-only

#

app = 'logicalenglish2'
primary_region = 'lhr'

[build]
  image = "le2:latest"

[env]
  # One sign-in for le2. and lps2.logicalcontracts.com: the lpsPlus sign-in
  # cookie is set for the parent domain (lpsPlus accounts/README.md). The
  # secrets — LC_AUTH_SECRET (the same on both apps), GOOGLE_CLIENT_ID/SECRET,
  # GITHUB_CLIENT_ID/SECRET — are set with `fly secrets set`, never here.
  LC_AUTH_COOKIE_DOMAIN = '.logicalcontracts.com'
  ALLOWED_LE_EXPORTS = "examples/moreExamples"

[http_service]
  internal_port = 3050
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpus = 1
  memory_mb = 1024
