<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/telemetry.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logical English — Documentation</title>
<script src="/web_extras/docsview/marked.min.js"></script>
<script src="/web_extras/docsview/docs-extras.js"></script>
<style>
:root {
    --bg: #ffffff; --ink: #1c2430; --muted: #5b6674; --accent: #0e639c;
    --border: #e2e6ea; --code-bg: #f5f6f8; --code-ink: #2a2f36;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #14181d; --ink: #dbe2ea; --muted: #97a3b0; --accent: #6db3ff;
        --border: #2a323b; --code-bg: #1c2229; --code-ink: #d6e0ea;
    }
}
* { box-sizing: border-box; }
body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header.docbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 10px 24px; display: flex; align-items: center; gap: 16px;
}
header.docbar a { color: var(--accent); text-decoration: none; font-size: 14px; }
header.docbar .spacer { flex: 1; }
.layout { display: flex; align-items: flex-start; }
nav.toc {
    position: sticky; top: 49px; flex: 0 0 230px; max-height: calc(100vh - 49px); overflow-y: auto;
    padding: 20px 8px 20px 24px; font-size: 14px; border-right: 1px solid var(--border);
}
nav.toc h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
nav.toc a { display: block; padding: 3px 0; color: var(--ink); text-decoration: none; }
nav.toc a:hover { color: var(--accent); }
nav.toc a.current { color: var(--accent); font-weight: 600; }
@media (max-width: 900px) { nav.toc { display: none; } }
main { flex: 1; min-width: 0; max-width: 860px; margin: 0 auto; padding: 24px 24px 64px; }
main img { max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; }
main h1, main h2, main h3 { line-height: 1.25; }
/* anchored headings land below the sticky docbar */
main h1, main h2, main h3, main h4, main h5, main h6 { scroll-margin-top: 58px; }
main h1 { font-size: 30px; margin-top: 0; }
main h2 { font-size: 23px; margin-top: 2em; border-bottom: 1px solid var(--border); padding-bottom: .2em; }
main h3 { font-size: 19px; margin-top: 1.6em; }
main a { color: var(--accent); }
main code {
    background: var(--code-bg); color: var(--code-ink);
    padding: .12em .4em; border-radius: 4px;
    font: 0.88em ui-monospace, SFMono-Regular, Menlo, monospace;
}
main pre {
    background: var(--code-bg); color: var(--code-ink);
    padding: 14px 16px; border-radius: 8px; overflow-x: auto;
}
main pre code { background: none; padding: 0; }
main blockquote {
    margin: 1em 0; padding: .4em 1em; border-left: 3px solid var(--accent);
    color: var(--muted); background: var(--code-bg); border-radius: 0 6px 6px 0;
}
main table { border-collapse: collapse; margin: 1em 0; display: block; overflow-x: auto; }
main th, main td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
main th { background: var(--code-bg); }
main hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
#status { color: var(--muted); padding: 24px; }
header.docbar form { display: flex; gap: 6px; }
header.docbar input[type=search], .docs-search-form input {
    font: 14px system-ui, sans-serif; padding: 4px 8px; border: 1px solid var(--border);
    border-radius: 5px; background: var(--bg); color: var(--ink); width: 16em; max-width: 40vw;
}
.docs-search-form { display: flex; gap: 8px; margin: 0 0 1em; }
.docs-search-form input { flex: 1; font-size: 16px; width: auto; max-width: none; }
.docs-search-form button { font: 15px system-ui, sans-serif; padding: 4px 14px; }
.docs-search-about { font-weight: 600; }
.docs-search-status, .docs-search-results small { color: var(--muted); }
.docs-search-results h2 { font-size: 19px; margin-top: 1.4em; }
.docs-search-results ul { padding-left: 1.2em; }
.docs-search-results li { margin: .5em 0; }
.docs-search-snippet { color: var(--muted); font-size: 14px; }
.docs-search-snippet mark { background: #ffe58f; color: #1c2430; padding: 0 1px; }
.docs-diagram { overflow-x: auto; margin: 1em 0; text-align: center; }
.docs-diagram svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<header class="docbar">
    <a href="/">&larr; Logical English</a>
    <a href="/editor/index.html">Editor</a>
    <span class="spacer"></span>
    <form action="/docs/search" method="get" role="search">
        <input type="search" name="q" placeholder="Search the documentation" aria-label="Search the documentation">
    </form>
    <a id="source-link" href="#" target="_blank" rel="noopener">View source on GitHub ↗</a>
</header>
<div class="layout">
<nav class="toc" id="toc" aria-label="Documentation"></nav>
<main id="content"><p id="status">Loading documentation…</p></main>
</div>
<script>
(async function () {
    // The rendered doc lives at this page's own URL; the raw Markdown is the
    // same path + ".md". Relative images therefore resolve correctly against
    // the page URL (e.g. /docs/user/tutorials/intro-to-le/intro-to-le -> its screenshots at
    // /docs/user/tutorials/intro-to-le/<img>.png), served by the same /docs route.
    const path = location.pathname.replace(/\/+$/, '');
    const mdUrl = path + '.md';

    // The table of contents (docs/user/nav.json) as a sidebar.
    fetch('/docs/user/nav.json').then(r => r.ok ? r.json() : null).then(nav => {
        if (!nav) return;
        const toc = document.getElementById('toc');
        for (const section of nav.sections) {
            const h = document.createElement('h4');
            h.textContent = section.title;
            toc.appendChild(h);
            for (const item of section.items) {
                const a = document.createElement('a');
                a.href = '/docs/user/' + item.path;
                a.textContent = item.title;
                if (item.blurb) a.title = item.blurb;
                if (a.pathname === path) a.className = 'current';
                toc.appendChild(a);
            }
        }
    }).catch(() => {});
    const gh = 'https://github.com/LogicalContracts/LogicalEnglish2/blob/main'
             + path.replace(/^\/docs/, '/docs') + '.md';
    document.getElementById('source-link').href = gh;

    // The anchors a heading gets (below), for the search's links too.
    const slug = (text) => text.trim().toLowerCase()
        .replace(/[^\p{L}\p{M}\p{Nd}\p{Nl}\p{Pc}\- ]/gu, '')
        .replace(/ /g, '-');

    // /docs/search?q=…: the documentation's full-text search.
    if (path === '/docs/search') {
        document.getElementById('source-link').hidden = true;
        document.querySelector('header.docbar form').hidden = true;
        await DocsExtras.renderSearchPage(document.getElementById('content'), {
            self: 'le2', navUrl: '/docs/user/nav.json', searchUrl: '/docs/search', slug,
            rawUrl: (p) => '/docs/user/' + p + '.md', docUrl: (p) => '/docs/user/' + p });
        return;
    }

    try {
        const resp = await fetch(mdUrl);
        if (!resp.ok) throw new Error(resp.status + ' ' + resp.statusText);
        const md = await resp.text();
        const title = (md.match(/^#\s+(.+)$/m) || [])[1];
        if (title) document.title = title + ' — Logical English';
        marked.setOptions({ gfm: true, breaks: false });
        const content = document.getElementById('content');
        content.innerHTML = marked.parse(md);

        // A link to another document (`../guide/editor.md#anchor`) opens it
        // rendered: the same address without `.md`.
        for (const a of content.querySelectorAll('a[href]')) {
            const href = a.getAttribute('href');
            if (/^[a-z]+:/i.test(href) || href.startsWith('#')) continue;
            const url = new URL(href, location.href);
            if (url.origin === location.origin && url.pathname.endsWith('.md')) {
                // Developer and project documents are not served: read them on GitHub.
                a.setAttribute('href', url.pathname.startsWith('/docs/user/')
                    ? url.pathname.slice(0, -3) + url.hash
                    : 'https://github.com/LogicalContracts/LogicalEnglish2/blob/main' + url.pathname + url.hash);
            }
        }

        // Heading ids, GitHub-style (marked v5+ no longer generates any, so
        // without this neither #deep-links nor the documents' own tables of
        // contents can navigate): lowercase, strip punctuation except
        // '-'/'_' , spaces to '-', duplicates deduped with -1, -2, …
        const seen = new Map();
        for (const h of content.querySelectorAll('h1,h2,h3,h4,h5,h6')) {
            const base = slug(h.textContent);
            const n = seen.get(base) || 0;
            seen.set(base, n + 1);
            h.id = n ? base + '-' + n : base;
        }

        // Links to the other IDE's documents go to where it is; diagrams are drawn.
        DocsExtras.rewritePeerLinks(content, 'le2');
        await DocsExtras.renderMermaid(content, 'le2', { mermaidSrc: '/web_extras/docsview/mermaid.min.js' });

        // Honor a #fragment in the URL: the browser's native scroll happened
        // before the Markdown was fetched, so scroll now — and again once
        // images have loaded (their arrival shifts the layout).
        const scrollToHash = () => {
            if (!location.hash) return;
            const hash = decodeURIComponent(location.hash.slice(1));
            // #sec-17.10: the heading of section 17.10 (the editor's links
            // from a diagnostic to the section of the reference it cites).
            const sec = /^sec-([\d.]*\d)$/.exec(hash);
            if (sec) {
                const h = [...content.querySelectorAll('h1,h2,h3,h4')]
                    .find(x => new RegExp('^' + sec[1].replace(/\./g, '\\.') + '\\.?\\s').test(x.textContent.trim()));
                if (h) { h.scrollIntoView(); return; }
            }
            const el = document.getElementById(hash);
            if (el) el.scrollIntoView();
        };
        scrollToHash();
        if (document.readyState === 'complete') scrollToHash();
        else window.addEventListener('load', scrollToHash, { once: true });
    } catch (e) {
        document.getElementById('content').innerHTML =
            '<p id="status">Could not load this document (' + e.message + '). '
            + 'You can read it <a href="' + gh + '">on GitHub</a>.</p>';
    }
})();
</script>
</body>
</html>
