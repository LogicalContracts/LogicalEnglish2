<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical English Editor</title>
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #header {
            height: 35px;
            line-height: 35px;
            padding: 0 15px;
            background-color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
        }
        #menu-bar {
            height: 30px;
            background-color: #2d2d2d;
            display: flex;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid #444;
            font-size: 13px;
        }
        .menu-item {
            padding: 0 10px;
            cursor: pointer;
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
        }
        .menu-item:hover {
            background-color: #444;
        }
        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #2d2d2d;
            border: 1px solid #444;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 1000;
            min-width: 150px;
        }
        .menu-item:hover .dropdown {
            display: block;
        }
        .dropdown-item {
            padding: 8px 15px;
            cursor: pointer;
            white-space: nowrap;
        }
        .dropdown-item:hover {
            background-color: #094771;
            color: white;
        }
        .dropdown-divider {
            height: 1px;
            background-color: #444;
            margin: 4px 0;
        }
        #header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: normal;
        }
        #container {
            height: calc(100% - 65px);
            width: 100%;
        }
        .logo {
            color: #4fc1ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="header">
        <div style="display: flex; align-items: center; gap: 20px;">
            <h1><span class="logo">LE</span> Editor</h1>
            <div id="filename-display" style="font-size: 12px; color: #888; font-style: italic;">document.le</div>
        </div>
        <div style="font-size: 12px; color: #aaa;">Logical English Browser-based Editor</div>
    </div>
    <div id="menu-bar">
        <div class="menu-item">
            File
            <div class="dropdown">
                <div class="dropdown-item" id="menu-new">New</div>
                <div class="dropdown-item" id="menu-open">Open...</div>
                <div class="dropdown-item" id="menu-open-server">Open from server...</div>
                <div class="dropdown-divider"></div>
                <div class="dropdown-item" id="menu-save" style="display: none;">Save</div>
                <div class="dropdown-item" id="menu-save-as">Save As...</div>
            </div>
        </div>
        <div class="menu-item">
            Edit
            <div class="dropdown">
                <div class="dropdown-item" id="menu-cut">Cut</div>
                <div class="dropdown-item" id="menu-copy">Copy</div>
                <div class="dropdown-item" id="menu-paste">Paste</div>
                <div class="dropdown-divider"></div>
                <div class="dropdown-item" id="menu-find">Find</div>
                <div class="dropdown-item" id="menu-replace">Replace</div>
            </div>
        </div>
        <div class="menu-item">
            Misc
            <div class="dropdown">
                <div style="padding: 8px 15px; font-weight: bold; font-size: 11px; color: #888;">THEME</div>
                <div class="dropdown-item" id="theme-dark">Dark</div>
                <div class="dropdown-item" id="theme-light">Light</div>
                <div class="dropdown-item" id="theme-hc">High Contrast</div>
                <div class="dropdown-divider"></div>
                <div style="padding: 8px 15px; font-weight: bold; font-size: 11px; color: #888;">FONT SIZE</div>
                <div class="dropdown-item" id="font-small">Small</div>
                <div class="dropdown-item" id="font-medium">Medium</div>
                <div class="dropdown-item" id="font-large">Large</div>
            </div>
        </div>
        <input type="file" id="file-input" accept=".le" style="display: none;">
    </div>
    <div id="container"></div>

    <!-- Modal for Server Examples -->
    <div id="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: #2d2d2d; border: 1px solid #444; width: 400px; max-height: 80vh; display: flex; flex-direction: column; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
            <div style="padding: 15px; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 16px;">Open from Server</h3>
                <span id="modal-close" style="cursor: pointer; font-size: 20px;">&times;</span>
            </div>
            <div id="example-list" style="padding: 10px; overflow-y: auto; flex-grow: 1;">
                <!-- Examples will be listed here -->
                <div style="padding: 20px; text-align: center; color: #888;">Loading examples...</div>
            </div>
            <div style="padding: 10px; border-top: 1px solid #444; text-align: right;">
                <button id="modal-cancel" style="background: #444; color: #fff; border: 1px solid #555; border-radius: 3px; padding: 5px 15px; cursor: pointer;">Cancel</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script type="module">
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], async function() {
            await import('./dist/client.js');
            window.startEditor();
        });
    </script>
</body>
</html>
