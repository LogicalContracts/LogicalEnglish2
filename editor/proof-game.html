<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE Proof Game</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --text-color: #d4d4d4;
            --header-bg: #333;
            --border-color: #444;
            --node-bg: #252526;
            --rule-head-bg: #ff9800;
            --rule-head-text: #000;
            --rule-body-bg: #ffeb3b;
            --rule-body-text: #000;
            --fact-bg: #4caf50;
            --fact-text: #fff;
            --query-bg: #2196f3;
            --query-text: #fff;
        }

        body.light-theme {
            --bg-color: #ffffff;
            --text-color: #000000;
            --header-bg: #f3f3f3;
            --border-color: #cccccc;
            --node-bg: #ffffff;
            --rule-head-bg: #ffb74d;
            --rule-body-bg: #fff59d;
            --fact-bg: #81c784;
            --query-bg: #64b5f6;
        }

        body.hc-theme {
            --bg-color: #000000;
            --text-color: #ffffff;
            --header-bg: #000000;
            --border-color: #ffffff;
            --node-bg: #000000;
            --rule-head-bg: #000;
            --rule-head-text: #fff;
            --rule-body-bg: #000;
            --rule-body-text: #fff;
            --fact-bg: #000;
            --fact-text: #fff;
            --query-bg: #000;
            --query-text: #fff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        #header {
            height: 40px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid var(--border-color);
            justify-content: space-between;
        }
        #header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: normal;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button, select {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 5px 15px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 2px;
            outline: none;
        }
        button:hover, select:hover {
            background-color: #1177bb;
        }
        #rete {
            width: 100%;
            height: calc(100% - 40px);
            display: flex;
            flex-direction: column;
        }

        /* ---- Drag-piece-into-slot board ---- */
        .pg-root {
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }
        .pg-board {
            flex: 1 1 auto;
            overflow: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .pg-section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: 8px;
        }
        .pg-card {
            background: var(--node-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }
        .pg-query-card { border-color: var(--query-bg); align-items: stretch; }
        .pg-query-label {
            background: var(--query-bg);
            color: var(--query-text);
            padding: 10px 14px;
            border-radius: 8px;
            min-width: 180px;
            text-align: center;
        }
        .pg-rule-head {
            background: var(--rule-head-bg);
            color: var(--rule-head-text);
            padding: 10px 14px;
            border-radius: 8px;
            min-width: 180px;
            text-align: center;
            cursor: pointer;
        }
        .pg-if-label {
            font-style: italic;
            opacity: 0.7;
            font-size: 13px;
        }
        .pg-body-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
        }
        .pg-cond {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .pg-cond-label {
            background: var(--rule-body-bg);
            color: var(--rule-body-text);
            padding: 8px 12px;
            border-radius: 8px;
            min-width: 160px;
            text-align: center;
            font-size: 13px;
        }

        /* Slots (drop targets) — size to fit either a token or a nested card */
        .pg-slot {
            min-width: 180px;
            min-height: 44px;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            transition: background 0.1s, border-color 0.1s;
        }
        .pg-slot.pg-slot-over {
            border-color: #0e639c;
            background: rgba(14,99,156,0.15);
        }
        .pg-slot.pg-slot-filled { border-style: solid; }
        .pg-slot.pg-slot-correct {
            border-color: #4caf50;
            background: rgba(76,175,80,0.15);
        }
        .pg-slot.pg-slot-wrong {
            border-color: #e53935;
            background: rgba(229,57,53,0.15);
        }
        /* A piece sitting inside a slot fills it neatly. */
        .pg-slot > .pg-piece { margin: 0; }

        /* Tray + pieces */
        .pg-tray {
            flex: 0 0 auto;
            border-top: 1px solid var(--border-color);
            background: var(--header-bg);
            padding: 12px 20px 16px;
            max-height: 45%;
            overflow: auto;
        }
        .pg-tray-pieces {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 12px;
            min-height: 44px;
        }
        .pg-piece {
            cursor: grab;
            user-select: none;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border: 1px solid transparent;
        }
        .pg-piece:active { cursor: grabbing; }
        .pg-piece.pg-dragging { opacity: 0.4; }

        /* Fact piece: a simple coloured token. */
        .pg-piece-fact {
            background: var(--fact-bg);
            color: var(--fact-text);
            padding: 10px 14px;
            min-width: 140px;
            text-align: center;
        }

        /* Rule piece: a card with a draggable head + nested body slots. */
        .pg-piece-rule {
            background: var(--node-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .pg-piece-rule .pg-rule-head { cursor: grab; }

        /* Pre-school mode: hide text but keep coloured shapes */
        body:not(.adult-mode) .pg-piece-fact,
        body:not(.adult-mode) .pg-query-label,
        body:not(.adult-mode) .pg-rule-head,
        body:not(.adult-mode) .pg-cond-label {
            color: transparent !important;
        }

        .pg-status {
            font-size: 13px;
            margin-right: auto;
            padding-left: 4px;
        }
        .pg-status-success { color: #4caf50; font-weight: bold; }
        .pg-status-progress { color: var(--rule-head-bg); }
    </style>
</head>
<body class="adult-mode">
    <div id="header">
        <h1>LE Proof Game</h1>
        <span id="pg-status" class="pg-status"></span>
        <div class="controls">
            <select id="theme-select">
                <option value="">Dark Theme</option>
                <option value="light-theme">Light Theme</option>
                <option value="hc-theme">High Contrast</option>
            </select>
            <label style="font-size: 12px;">
                <input type="checkbox" id="mode-toggle" checked> Adult Mode (Show Text)
            </label>
            <button id="btn-reset">Reset</button>
            <button id="btn-check">Check Proof</button>
        </div>
    </div>
    <div id="rete"></div>
    
    <script>
        // Apply theme from URL if present
        const urlParams = new URLSearchParams(window.location.search);
        const theme = urlParams.get('theme');
        if (theme) {
            document.body.classList.add(theme);
            document.getElementById('theme-select').value = theme;
        }
        
        document.getElementById('theme-select').addEventListener('change', (e) => {
            document.body.classList.remove('light-theme', 'hc-theme');
            if (e.target.value) {
                document.body.classList.add(e.target.value);
            }
        });
        
        document.getElementById('mode-toggle').addEventListener('change', (e) => {
            if (e.target.checked) {
                document.body.classList.add('adult-mode');
            } else {
                document.body.classList.remove('adult-mode');
            }
        });
    </script>
    
    <script type="module">
        const v = Date.now();
        import(`./dist/proof-game.js?v=${v}`).then(module => {
            const initProofGame = module.initProofGame;
            
            const gameDataStr = localStorage.getItem('le_proof_game_data');
            if (gameDataStr) {
                try {
                    const gameData = JSON.parse(gameDataStr);
                    initProofGame(document.getElementById('rete'), gameData);
                } catch (e) {
                    console.error("Failed to parse game data", e);
                    document.getElementById('rete').innerHTML = "<div style='padding: 20px'>Error loading game data.</div>";
                }
            } else {
                document.getElementById('rete').innerHTML = "<div style='padding: 20px'>No game data found. Please launch from the editor.</div>";
            }
        });
    </script>
</body>
</html>
