<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Box</title>
    <style>
        :root {
            --bg-color: #1e1e1e; --text-color: #d4d4d4; --header-bg: #333;
            --border-color: #444; --panel-bg: #252526; --muted: #888; --accent: #0e639c;
            --tray-bg: #17130f;      /* the lacquered tray */
            --tray-edge: #3a2e24;
            --empty-bg: #0a0a0a;     /* failed nodes: empty dark space */
            --cell-text: #f2ede6;
            --assumed: #e2b93d;
        }
        body.light-theme {
            --bg-color: #ffffff; --text-color: #000000; --header-bg: #f3f3f3;
            --border-color: #cccccc; --panel-bg: #f6f8fa; --muted: #666;
            --tray-bg: #2b241d; --tray-edge: #57493c;
            --empty-bg: #101010; --cell-text: #1c1c1c;
        }
        body.hc-theme {
            --bg-color: #000000; --text-color: #ffffff; --header-bg: #000000;
            --border-color: #ffffff; --panel-bg: #000000; --muted: #ccc;
            --tray-bg: #000000; --tray-edge: #ffffff;
            --empty-bg: #000000; --cell-text: #ffffff;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px; display: flex; flex-direction: column;
        }
        header {
            background: var(--header-bg); border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
        }
        header h1 { font-size: 15px; margin: 0; font-weight: 600; }
        #answer { font-size: 12px; color: var(--muted); margin-top: 4px; }
        #main { flex: 1; display: flex; min-height: 0; }
        /* The tray: outer container of the whole meal. */
        #tray-wrap { flex: 1; min-width: 0; padding: 18px; display: flex; }
        #tray {
            flex: 1; display: flex; min-width: 0; min-height: 0;
            background: var(--tray-bg); border: 3px solid var(--tray-edge);
            border-radius: 18px; padding: 10px; gap: 10px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.35), inset 0 0 40px rgba(0,0,0,0.35);
        }
        /* A compartment (one explanation node). Fill and border colors are set
           inline per node (unique hue each). */
        .bento-box {
            display: flex; gap: 7px; padding: 7px;
            border-radius: 12px; border: 2px solid transparent;
            min-width: 26px; min-height: 26px; overflow: hidden;
            transition: box-shadow 0.15s ease;
            cursor: pointer;
        }
        .bento-box:hover { box-shadow: 0 0 0 2px var(--accent); }
        .bento-box.flash { box-shadow: 0 0 0 3px #ffffff; }
        /* A leaf: the "food" — the literal, plated in the middle. */
        .bento-box.leaf {
            align-items: center; justify-content: center; text-align: center;
            font-size: 12.5px; line-height: 1.35; color: var(--cell-text);
            padding: 10px; word-break: break-word;
        }
        /* A leaf's image content ("; image \"URL\"" additions): no padding —
           the image scales proportionally until it touches the box. */
        .bento-box.leaf.has-image { padding: 0; }
        .bento-img {
            width: 100%; height: 100%; min-height: 0; min-width: 0;
            object-fit: contain; border-radius: 10px;
        }
        /* Failed node: an empty, dark compartment. */
        .bento-box.failed {
            background: var(--empty-bg) !important; border-color: #000 !important;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
        }
        .bento-box.failed:hover { box-shadow: inset 0 2px 10px rgba(0,0,0,0.8), 0 0 0 2px var(--accent); }
        /* Assumed (unknown) node: dashed amber rim — the pickled plum of the box. */
        .bento-box.assumed { border-style: dashed !important; border-color: var(--assumed) !important; }
        /* Legend */
        #legend {
            width: 300px; flex: none; overflow: auto;
            border-left: 1px solid var(--border-color); background: var(--panel-bg);
            padding: 10px 12px;
        }
        #legend h2 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin: 4px 0 8px; }
        .legend-row {
            display: flex; align-items: flex-start; gap: 8px;
            padding: 3px 4px; border-radius: 6px; cursor: pointer; font-size: 12px;
        }
        .legend-row:hover { background: rgba(128,128,128,0.15); }
        .legend-swatch {
            flex: none; width: 14px; height: 14px; margin-top: 1px;
            border-radius: 4px; border: 2px solid transparent;
        }
        .legend-path { flex: none; color: var(--muted); font-size: 11px; min-width: 30px; }
        .legend-text { min-width: 0; }
        .legend-row.failed .legend-text { color: #f48771; }
        .legend-row.assumed .legend-text { color: var(--assumed); }
        #status {
            border-top: 1px solid var(--border-color); background: var(--header-bg);
            color: var(--muted); font-size: 11px; padding: 6px 16px;
        }
    </style>
</head>
<body>
    <header>
        <h1 id="title">Bento Box</h1>
        <div id="answer"></div>
    </header>
    <div id="main">
        <div id="tray-wrap"><div id="tray"></div></div>
        <aside id="legend">
            <h2 data-i18n>Legend</h2>
            <div id="legend-rows"></div>
        </aside>
    </div>
    <div id="status" data-i18n>Click a box to highlight its source in the editor.</div>

    <script>
        const theme = new URLSearchParams(window.location.search).get('theme');
        if (theme) document.body.classList.add(theme);
    </script>
    <script type="module">
        const v = Date.now();
        import(`./dist/bento-box.js?v=${v}`).then(m => m.initBentoBox());
    </script>
</body>
</html>
