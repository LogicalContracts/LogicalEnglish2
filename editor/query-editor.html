<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE Query Editor</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --text-color: #d4d4d4;
            --header-bg: #333;
            --border-color: #444;
            --panel-bg: #252526;
            --input-bg: #3c3c3c;
            --input-text: #d4d4d4;
            --input-border: #555;
            --accent: #0e639c;
            --field-bg: #2d2d30;
            --muted: #888;
        }
        body.light-theme {
            --bg-color: #ffffff;
            --text-color: #1e1e1e;
            --header-bg: #f3f3f3;
            --border-color: #cccccc;
            --panel-bg: #f8f8f8;
            --input-bg: #ffffff;
            --input-text: #1e1e1e;
            --input-border: #bbbbbb;
            --field-bg: #eef3f8;
            --muted: #666;
        }
        body.hc-theme {
            --bg-color: #000000;
            --text-color: #ffffff;
            --header-bg: #000000;
            --border-color: #ffffff;
            --panel-bg: #000000;
            --input-bg: #000000;
            --input-text: #ffffff;
            --input-border: #ffffff;
            --field-bg: #111111;
            --muted: #cccccc;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            display: flex;
            flex-direction: column;
        }
        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
        header label { color: var(--muted); margin-right: 4px; }
        select, input[type="text"], button {
            background: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            padding: 5px 8px;
            font-size: 14px;
            font-family: inherit;
        }
        button { cursor: pointer; }
        button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        button:hover { filter: brightness(1.1); }
        #main {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }
        #join-hint { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
        #join-hint b { color: var(--text-color); font-weight: 600; }
        #rows { display: flex; flex-direction: column; gap: 8px; }
        .fact-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 10px;
        }
        .fact-row .word { white-space: nowrap; }
        .fact-row input.field, .fact-row input.raw {
            background: var(--field-bg);
            min-width: 90px;
            width: auto;
        }
        .fact-row input.raw { min-width: 220px; }
        /* The per-row connective ("and"/"or") and the alignment spacer on row 0. */
        .fact-row select.connective { min-width: 64px; color: var(--accent); font-weight: 600; }
        .fact-row .connective-spacer { display: inline-block; min-width: 64px; }
        .fact-row .neg-phrase { color: var(--muted); font-style: italic; white-space: nowrap; }
        .fact-row.negated { border-color: var(--accent); }
        .row-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .row-tools .negate {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 11px; color: var(--muted); cursor: pointer; white-space: nowrap;
        }
        .row-tools button {
            padding: 2px 8px;
            line-height: 1.2;
            background: transparent;
            border-color: var(--input-border);
            color: var(--muted);
        }
        .row-tools button:hover { color: var(--text-color); }
        .empty-hint { color: var(--muted); font-style: italic; padding: 10px 0; }
        #add-bar {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        #add-template { min-width: 320px; max-width: 520px; }
        footer {
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        footer .spacer { flex: 1; }
        #status { color: var(--muted); font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <h1>Query Editor</h1>
        <span><label for="query-picker">Query</label>
            <select id="query-picker"></select></span>
        <span><label for="query-name">Name</label>
            <input type="text" id="query-name" placeholder="query name" size="18"></span>
    </header>

    <div id="main">
        <div id="join-hint">Conditions are combined top to bottom — pick <b>and</b> / <b>or</b> before each one (<b>and</b> by default). Tick <b>not</b> to negate a condition.</div>
        <div id="rows"></div>
        <div id="add-bar">
            <label for="add-template">Add condition</label>
            <select id="add-template"></select>
            <button id="btn-add">+ Add</button>
        </div>
    </div>

    <footer>
        <span id="status"></span>
        <span class="spacer"></span>
        <button id="btn-copy">Copy</button>
        <button id="btn-insert" class="primary">Insert into Editor</button>
    </footer>

    <script>
        // Use whatever theme the editor passed in (no in-window theme picker).
        const theme = new URLSearchParams(window.location.search).get('theme');
        if (theme) document.body.classList.add(theme);
    </script>

    <script type="module">
        const v = Date.now();
        import(`./dist/query-editor.js?v=${v}`).then(module => {
            const dataStr = localStorage.getItem('le_query_editor_data');
            let data = {};
            try { data = dataStr ? JSON.parse(dataStr) : {}; } catch (e) { console.error(e); }
            module.initQueryEditor(data);
        });
    </script>
</body>
</html>
